# Properties can be overridden at runtime via a '-P' script parameter. For example:  -PideaVersion=IC-2017.1
#    In an IntelliJ IDEA Gradle Run/Debug Configuration, put in the "Script parameters" field (includeing the -P)
org.gradle.jvmargs=-Xms256m -Xmx320m -Dfile.encoding=UTF-8
systemProp.file.encoding=utf-8
# Enable Gradle Build Cache
org.gradle.caching=true

frcPluginBaseVersion=1.4.0
# Leave blank for non EAPs, or set to "-eap.1", "-eap.2", etc.
frcPluginEapDesignator=-SNAPSHOT
# Always run a clean build (i.e. ./gradlew clean test buildPlugin) after updating/changing the ideaVersion
ideaMajorVersion=2020.2
# intellij task 'version' attribute: The version of the IntelliJ Platform IDE that will be used to build the plugin.
ideaVersion=IC-2020.2
isEAP=false
ideaSinceBuild =202.6397
ideaUntilBuild =202.*
sandboxName=.sandbox
ideaUpdateSinceUntilBuild=true
ideaSameSinceUntilBuild=false
ideaDownloadSources=true

# alternativeIdePath = Absolute path to the locally installed JetBrains IDE. It makes sense to use this 
# property if you want to test your plugin in WebStorm or any other non-IDEA JetBrains IDE. Empty value 
# means that the IDE that was used for compiling will be used for running/debugging as well. 
altIdeaPath=