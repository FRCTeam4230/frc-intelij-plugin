import java.nio.charset.StandardCharsets
import java.nio.file.FileVisitResult
import java.nio.file.Files
import java.nio.file.Paths
import java.nio.file.SimpleFileVisitor
import java.nio.file.attribute.BasicFileAttributes



buildscript {
  ext.kotlin_version = '1.1.1'

  repositories {
    mavenCentral()
    maven { url 'http://dl.bintray.com/jetbrains/intellij-plugin-service' }
    flatDir { dirs 'libs' }
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

plugins {
  id "org.jetbrains.intellij" version "0.2.7"
}

allprojects {
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
    kotlinOptions {
      jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
  }
}

apply plugin: 'java'
apply plugin: 'kotlin'
apply plugin: 'org.jetbrains.intellij'
intellij {
  version ideaVersion
  pluginName 'FRC'
  downloadSources Boolean.valueOf(downloadIdeaSources)
  
  sameSinceUntilBuild Boolean.valueOf(isEAP)
  // alternativeIdePath = Absolute path to the locally installed JetBrains IDE. It makes sense to use this 
  // property if you want to test your plugin in WebStorm or any other non-IDEA JetBrains IDE. Empty value 
  // means that the IDE that was used for compiling will be used for running/debugging as well.  
  alternativeIdePath altIdeaPath
  updateSinceUntilBuild Boolean.valueOf(shouldUpdateSinceUntilBuild)
  
  plugins = []
  
  runIde {
    systemProperties = ['key1': 'value1', 'key2': 'value2']
  }
  
  publishPlugin {
    username 'javaru'
    password System.properties['intellij.publish.password']
  }
}

group 'com.example.groupId'
version = "${version}${buildNumber}"

sourceCompatibility = javaVersion
targetCompatibility = javaVersion
tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

repositories {
  mavenCentral()
  maven { url 'http://dl.bintray.com/jetbrains/intellij-plugin-service' }
  flatDir { dirs 'libs' }
}

prepareSandbox.doFirst {

  
  
  def logDir = "${buildDir}/idea-sandbox/system/log"
  def logDirPath = Paths.get(logDir)
  Files.walkFileTree(logDirPath, new MyFileVisitor())
  def logFile = logDir + "/idea.log"
  def append = false
  def autoFlush = true
  def file = file(logFile)
  def writer = new PrintWriter(new OutputStreamWriter(new FileOutputStream(file, append), StandardCharsets.UTF_8), autoFlush)
  writer.flush()
  writer.close()
}


dependencies {
  compile group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-jre8', version: kotlin_version
  compile group: 'org.jetbrains.kotlin', name: 'kotlin-reflect', version: kotlin_version
  compile group: 'org.jetbrains.kotlin', name: 'kotlin-runtime', version: kotlin_version
  testCompile group: 'org.jetbrains.kotlin', name: 'kotlin-test', version: kotlin_version
  compile 'org.jdom:jdom2:2.0.6'
  compile 'commons-io:commons-io:2.5'
  compile 'org.apache.commons:commons-lang3:3.5'
  compile 'com.jcraft:jsch:0.1.54'
  testCompile group: 'junit', name: 'junit', version: '4.12'
}

class MyFileVisitor extends SimpleFileVisitor<java.nio.file.Path>
{
  boolean inThreadDumpsDir = false


  @Override
  FileVisitResult preVisitDirectory(java.nio.file.Path dir, BasicFileAttributes attrs) throws IOException
  {
    if (!inThreadDumpsDir)
    {
      inThreadDumpsDir = dir.getFileName().toString().startsWith("threadDumps-")
    }
    return FileVisitResult.CONTINUE
  }


  @Override
  FileVisitResult visitFile(java.nio.file.Path file, BasicFileAttributes attrs) throws IOException
  {
    if (inThreadDumpsDir)
    {
      Files.deleteIfExists(file)
    }
    return FileVisitResult.CONTINUE
  }


  @Override
  FileVisitResult postVisitDirectory(java.nio.file.Path dir, IOException exc) throws IOException
  {
    if (inThreadDumpsDir)
    {
      if (dir.getFileName().toString().startsWith("threadDumps-"))
      {
        // we're leaving the actual threadDumps dir (and not one of its sub directories) so we can reset the flag
        inThreadDumpsDir = false
      }
      Files.deleteIfExists(dir)
    }
    return FileVisitResult.CONTINUE
  }
}