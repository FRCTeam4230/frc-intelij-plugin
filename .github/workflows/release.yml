name: Release

# Builds the plugin and creates a GitHub release (and its version tag). Run it from the Actions tab
# (Actions > Release > Run workflow):
#   - version:           leave blank to release the current 'frcPluginBaseVersion' in gradle.properties, or enter a new
#                        version (e.g. 5.2.0) to update gradle.properties, commit the change, and release it
#   - pre-release label: optional (e.g. beta.1) to create a pre-release, e.g. 5.1.0-2026.2-beta.1 tagged v5.1.0-beta.1
# Pushing a tag that matches 'frcPluginBaseVersion' (e.g. v5.1.0 or v5.1.0-beta.1) also creates a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 5.2.0). Leave blank to use frcPluginBaseVersion from gradle.properties.'
        required: false
        default: ''
      prerelease-label:
        description: 'Pre-release label (e.g. beta.1). Leave blank for a full release.'
        required: false
        default: ''
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history and tags, so the release notes can list the changes since the previous release

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LABEL: ${{ inputs.prerelease-label }}
        run: |
          prop() { grep -E "^$1=" gradle.properties | cut -d= -f2- | tr -d '\r'; }
          current="$(prop frcPluginBaseVersion)"
          bump=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base="$(echo "$INPUT_VERSION" | tr -d '[:space:]' | sed 's/^v//')"
            label="$(echo "$INPUT_LABEL" | tr -d '[:space:]' | sed 's/^-//')"
            if [ -z "$base" ]; then base="$current"; fi
            if ! echo "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version '$base' must be in the form MAJOR.MINOR.PATCH (e.g. 5.2.0)."; exit 1
            fi
            if [ -n "$label" ] && ! echo "$label" | grep -Eq '^[0-9A-Za-z.]+$'; then
              echo "::error::Pre-release label '$label' may only contain letters, digits, and dots (e.g. beta.1)."; exit 1
            fi
            suffix="${label:+-$label}"
            tag="v${base}${suffix}"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::Tag '$tag' already exists. Enter a new version or pre-release label."; exit 1
            fi
            if [ "$base" != "$current" ]; then
              bump=true
              sed -i -E "s/^frcPluginBaseVersion=.*/frcPluginBaseVersion=$base/" gradle.properties
            fi
          else
            # Triggered by a pushed tag, which must match the version in gradle.properties
            tag="$GITHUB_REF_NAME"
            base="$current"
            # Anything after the base version (e.g. '-beta.1') becomes the EAP designator, and marks the release as a pre-release
            case "$tag" in
              "v${base}")   suffix="" ;;
              "v${base}-"*) suffix="${tag#v${base}}" ;;
              *) echo "::error::Tag '$tag' does not match frcPluginBaseVersion '$base' in gradle.properties. Use 'v$base' or 'v$base-<suffix>'."; exit 1 ;;
            esac
          fi
          {
            echo "tag=$tag"
            echo "base=$base"
            echo "bump=$bump"
            echo "suffix=$suffix"
            echo "prerelease=$([ -n "$suffix" ] && echo true || echo false)"
            echo "version=${base}-$(prop ideaMajorVersion)${suffix}"
            echo "ide_version=$(prop ideaMajorVersion)"
            echo "since_build=$(prop ideaSinceBuild)"
            echo "until_build=$(prop ideaUntilBuild)"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing ${base}-$(prop ideaMajorVersion)${suffix} as tag $tag"

      # If the FRC_PLUGIN_BUILD_TOKENS secret is set (the contents of the build token replacements properties file,
      # e.g. the Sentry DSNs), it is used for the build. Otherwise, stand-in values are used.
      - name: Configure build tokens
        env:
          BUILD_TOKENS: ${{ secrets.FRC_PLUGIN_BUILD_TOKENS }}
        run: |
          if [ -n "$BUILD_TOKENS" ]; then
            printf '%s\n' "$BUILD_TOKENS" > "$RUNNER_TEMP/frc-plugin-tokens.properties"
            echo "FRC_PLUGIN_BUILD_REPLACEMENT_TOKENS_PROPERTIES_FILE=$RUNNER_TEMP/frc-plugin-tokens.properties" >> "$GITHUB_ENV"
          else
            echo "::notice::FRC_PLUGIN_BUILD_TOKENS secret is not set. Building with stand-in values (error reporting will not be configured)."
          fi

      - name: Build plugin
        run: ./gradlew -Pis.ci.build=true "-PfrcPluginEapDesignator=${{ steps.version.outputs.suffix }}" -x buildSearchableOptions buildPlugin check

      - name: Prepare release assets
        id: assets
        run: |
          zip_path="$(ls build/distributions/*.zip)"
          zip_name="$(basename "$zip_path")"
          expected="FRC-${{ steps.version.outputs.version }}.zip"
          if [ "$zip_name" != "$expected" ]; then echo "::error::Built '$zip_name' but expected '$expected'"; exit 1; fi
          (cd build/distributions && sha256sum "$zip_name" > "$zip_name.sha256")
          sed -e "s|{{ZIP_NAME}}|$zip_name|g" \
              -e "s|{{IDE_VERSION}}|${{ steps.version.outputs.ide_version }}|g" \
              -e "s|{{SINCE_BUILD}}|${{ steps.version.outputs.since_build }}|g" \
              -e "s|{{UNTIL_BUILD}}|${{ steps.version.outputs.until_build }}|g" \
              .github/release-install-instructions.md > "$RUNNER_TEMP/release-notes.md"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      # Only done once the build and tests have passed, so a failed release does not leave a version change behind
      - name: Commit version change
        if: steps.version.outputs.bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release ${{ steps.version.outputs.base }}" -- gradle.properties
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Determine release commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Lists the commits since the previous GitHub release. The previous release is looked up via the GitHub releases
      # (rather than tags) as the repository also contains old tags from before the move to GitHub. A full release lists
      # all the changes since the previous full release (i.e. including those in any pre-releases since then), while a
      # pre-release lists the changes since the previous release of either kind.
      - name: Add changes to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          exclude_prereleases="$([ "$PRERELEASE" = "true" ] || echo "--exclude-pre-releases")"
          previous="$(gh release list --exclude-drafts $exclude_prereleases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          {
            echo
            echo "## What's changed"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s (%h)' "$previous..$TARGET"
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            elif git fetch --quiet https://gitlab.com/Javaru/frc-intellij-idea-plugin.git main 2>/dev/null; then
              # First release: list the changes made since this fork of the original project
              echo "Changes since the original [FRC plugin](https://gitlab.com/Javaru/frc-intellij-idea-plugin):"
              echo
              git log --no-merges --format='- %s (%h)' "FETCH_HEAD..$TARGET"
            else
              git log --no-merges --format='- %s (%h)' -n 20 "$TARGET"
            fi
          } >> "$notes"

      # Creates the tag (if it was not pushed) on the release commit, along with the release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.assets.outputs.zip_path }}" \
            "${{ steps.assets.outputs.zip_path }}.sha256" \
            --target "${{ steps.target.outputs.sha }}" \
            --title "FRC Plugin ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $([ "${{ steps.version.outputs.prerelease }}" = "true" ] && echo "--prerelease")
