# WARNING: single-quotes/apostrophes have special meaning in a message pattern.
#               The single quote is used to represent a section within the message pattern that will not be formatted. 
#               Thus, to use a single quote itself, it must be escaped by using two single quotes ('').
#               See https://www.mscharhag.com/java/resource-bundle-single-quote-escaping
#          Also, the BundleBase for the IntelliJ API replaces ampersands '&' as UI mnemonics. 
#               If you want an ampersand you have to escape it along with the escape character to get: \\&
#               For example:  key=This \\& That
