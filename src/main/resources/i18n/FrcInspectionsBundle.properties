# WARNING: single-quotes/apostrophes have special meaning in a message pattern.
#               The single quote is used to represent a section within the message pattern that will not be formatted.
#               **If the message has a placeholder in it at all, we needs to escape any single quotes with another single quote**
#               If there is no placeholder in the message, escaping is NOT needed
#                   test.message1=Sam's message  ==>  message("test.message1");             ==>  Sam's message   <== ok
#                   test.message2={0}'s message  ==>  message("test.message2", "Sam");      ==>  Sams message    <== NO
#                   test.message3=Sam's {0}      ==>  message("test.message3", "message");  ==>  Sams {0}        <== NO
#                   test.message4={0}''s message ==>  message("test.message4", "Sam");      ==>  Sam's message   <== YES
#                   test.message5=Sam''s {0}     ==>  message("test.message5", "message");  ==>  Sam's message   <== YES
#               See unit tests for examples of the above
#               See https://www.mscharhag.com/java/resource-bundle-single-quote-escaping
#          Also, the BundleBase for the IntelliJ API replaces ampersands '&' as UI mnemonics. 
#               If you want an ampersand you have to escape it along with the escape character to get: \\&
#               For example:  key=This \\& That

